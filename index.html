<!DOCTYPE html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="icon" type="image/svg+xml" href="/imgs/logo/favicon.svg" />
    <link rel="stylesheet" href="./css/resetCss.css" />
    <link rel="stylesheet" href="./css/index.css" />

    <title>판다마켓</title>
  </head>
  <body>
    <header>
      <div class="headerContainer">
        <a href="/">
          <img src="./imgs/logo/headerLogo.png" />
        </a>
        <a class="loginBtn" href="./login">로그인</a>
      </div>
    </header>
    <main>
      <section class="banner">
        <div class="bannerContainer">
          <div class="bannerTitleContainer">
            <h1>
              일상의 모든 물건을
              <br />
              거래해 보세요
            </h1>
            <a class="browseBtn" href="./itemList">구경하러 가기</a>
          </div>
          <img
            src="./imgs/contents/Img_home_top.png"
            class="imgWrapper"
            alt="img_home_top"
          />
        </div>
      </section>
      <section class="contentContainer">
        <div class="contentBox contentBoxTop">
          <img src="imgs/contents/Img_home_01.png" alt="contentImg01" />
          <div>
            <p class="smallText">Hot item</p>
            <h1 class="contentTitleText">
              인기 상품을
              <br />
              확인해보세요
            </h1>
            <p class="textDescription">
              가장 HOT한 중고거래 물품을
              <br />
              판다 마켓에서 확인해 보세요
            </p>
          </div>
        </div>

        <div class="contentBox contentBoxMiddle">
          <div class="textAlineBox">
            <p class="smallText">Search</p>
            <h1 class="contentTitleText">
              구매를 원하는
              <br />
              상품을 검색하세요
            </h1>
            <p class="textDescription">
              구매하고 싶은 물품은 검색해서
              <br />
              쉽게 찾아보세요
            </p>
          </div>
          <img src="imgs/contents/Img_home_02.png" alt="contentImg02" />
        </div>

        <div class="contentBox contentBoxBottom">
          <img src="imgs/contents/Img_home_03.png" alt="contentImg01" />
          <div>
            <p class="smallText">Register</p>
            <h1 class="contentTitleText">
              판매를 원하는
              <br />
              상품을 등록하세요
            </h1>
            <p class="textDescription">
              어떤 물건이든 판매하고 싶은 상품을
              <br />
              쉽게 등록하세요
            </p>
          </div>
        </div>
      </section>

      <section class="banner">
        <div class="bannerContainer">
          <div class="bannerTitleContainer">
            <h1>
              믿을 수 있는
              <br />
              판다마켓 중고 거래
            </h1>
          </div>
          <img
            src="./imgs/contents/Img_home_bottom.png"
            alt="contentImg02"
            class="imgWrapper"
          />
        </div>
      </section>
    </main>
    <footer>
      <div class="footerContainer">
        <p>©codeit - 2024</p>
        <div class="footerFAQBox">
          <a href="./privacy">Privacy Policy</a>
          <a href="./faq">FAQ</a>
        </div>
        <div class="footerSnsBox">
          <a href="https://www.facebook.com/?locale=ko_KR" target="_blank">
            <img src="./imgs/footerIcon/ic_faceBook.svg" alt="페이스북" />
          </a>
          <a href="https://x.com/?lang=ko" target="_blank">
            <img src="./imgs/footerIcon/ic_twitter.svg" alt="트위터" />
          </a>
          <a
            href="https://www.youtube.com/?hl=ko&gl=KR&app=desktop"
            target="_blank"
          >
            <img src="./imgs/footerIcon/ic_youtube.svg" alt="유튜브" />
          </a>
          <a href="https://www.instagram.com/" target="_blank">
            <img src="./imgs/footerIcon/ic_instagram.svg" alt="인스타그램" />
          </a>
        </div>
      </div>
    </footer>
  </body>
</html>
